<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policy Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2d3148;
      --accent: #6c8bff;
      --accent-dim: #3d4f99;
      --text: #e4e7f5;
      --text-dim: #7b82a8;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #f87171;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 500; font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }

    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 12px; color: var(--text-dim); margin-top: 1px; }

    .status-dot {
      margin-left: auto;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 780px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; width: 100%; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: var(--accent-dim);
      color: #fff;
      border-radius: var(--radius) var(--radius) 2px var(--radius);
    }

    .assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px var(--radius) var(--radius) var(--radius);
    }

    .citations {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .citation-label {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .citation-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 10px 14px;
    }

    .citation-card .doc-title {
      font-weight: 500;
      font-size: 13px;
      color: var(--accent);
    }

    .citation-card .doc-source {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .citation-card .doc-snippet {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 6px;
      line-height: 1.5;
      font-style: italic;
    }

    .meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px var(--radius) var(--radius) var(--radius);
      width: fit-content;
    }

    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #question-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
    }

    #question-input:focus { border-color: var(--accent); }
    #question-input::placeholder { color: var(--text-dim); }

    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
      height: 42px;
    }

    #send-btn:hover { opacity: 0.88; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .error-bubble {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
    }

    .welcome {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 600px;
      align-self: center;
      margin: auto;
    }

    .welcome h2 { font-size: 18px; margin-bottom: 8px; }
    .welcome p { color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; }

    .sample-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sample-q {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      color: var(--text-dim);
    }

    .sample-q:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="logo">P</div>
    <div>
      <h1>Policy Assistant</h1>
      <p>Ask questions about company policies &amp; procedures</p>
    </div>
    <div class="status-dot" id="status-dot" title="Online"></div>
  </header>

  <div id="chat-container">
    <div class="message assistant">
      <div class="welcome">
        <h2>👋 Hello!</h2>
        <p>I can answer questions about company policies — HR, security, expenses, remote work, and more. I'll always cite the source documents.</p>
        <p class="hint">Try one of these:</p>
        <div class="sample-questions">
          <button class="sample-q" onclick="askSample(this)">How many PTO days do I get?</button>
          <button class="sample-q" onclick="askSample(this)">What's the expense reimbursement policy?</button>
          <button class="sample-q" onclick="askSample(this)">Can I work remotely full time?</button>
          <button class="sample-q" onclick="askSample(this)">What are the data security requirements?</button>
          <button class="sample-q" onclick="askSample(this)">How do I report a security incident?</button>
        </div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-row">
      <textarea
        id="question-input"
        placeholder="Ask about company policies…"
        rows="1"
        maxlength="1000"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <div class="hint">Press Enter to send · Shift+Enter for new line</div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const input = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function askSample(btn) {
      input.value = btn.textContent;
      sendMessage();
    }

    function appendMessage(role, content, citations = [], meta = '') {
      const div = document.createElement('div');
      div.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role === 'error' ? 'error-bubble' : ''}`;
      bubble.textContent = content;
      div.appendChild(bubble);

      if (citations && citations.length > 0) {
        const cSection = document.createElement('div');
        cSection.className = 'citations';

        const label = document.createElement('div');
        label.className = 'citation-label';
        label.textContent = `Sources (${citations.length})`;
        cSection.appendChild(label);

        citations.forEach(c => {
          const card = document.createElement('div');
          card.className = 'citation-card';
          card.innerHTML = `
            <div class="doc-title">${escapeHtml(c.title)}</div>
            <div class="doc-source">${escapeHtml(c.source)}</div>
            <div class="doc-snippet">"${escapeHtml(c.snippet)}"</div>
          `;
          cSection.appendChild(card);
        });
        div.appendChild(cSection);
      }

      if (meta) {
        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta;
        div.appendChild(metaEl);
      }

      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function addTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.id = 'typing';
      div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function sendMessage() {
      const question = input.value.trim();
      if (!question || sendBtn.disabled) return;

      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', question);
      addTypingIndicator();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        removeTypingIndicator();

        if (!res.ok) {
          appendMessage('error', data.error || 'An error occurred.');
        } else {
          const meta = `${data.latency_ms}ms · ${data.chunks_retrieved} chunks · ${data.model}`;
          appendMessage('assistant', data.answer, data.citations, meta);
        }
      } catch (err) {
        removeTypingIndicator();
        appendMessage('error', 'Network error. Please try again.');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // Health check
    fetch('/health').then(r => r.json()).then(d => {
      document.getElementById('status-dot').title = `Online · ${d.model}`;
    }).catch(() => {
      document.getElementById('status-dot').style.background = 'var(--red)';
    });
  </script>
</body>
</html>
