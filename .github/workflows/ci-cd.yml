name: CI / Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import check
        run: python -c "import app; print('✅ Import OK')"

      - name: Generate sample policies (for tests)
        run: python scripts/generate_sample_policies.py

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'ci-placeholder' }}
          FLASK_ENV: testing
          POLICIES_DIR: ./data/policies
          CHROMA_DB_PATH: ./data/chroma_db
        run: pytest tests/ -v --tb=short

  # ── Deploy to Render (main branch only) ────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy webhook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
        # Set RENDER_DEPLOY_HOOK_URL in GitHub repo Settings > Secrets
        # Get it from Render dashboard: Service > Settings > Deploy Hook
